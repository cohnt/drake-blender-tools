schema_version = "1.0.0"

id = "meshcat_html_importer"
version = "0.1.3"
name = "Meshcat HTML Importer"
tagline = "Import meshcat HTML recordings into Blender"
maintainer = "Nicholas Pfaff <nepfaff@mit.edu>"

type = "add-on"
blender_version_min = "5.0.0"

# Downloaded by `make addon-wheels` (pinned in the Makefile).
wheels = [
  "./wheels/pycollada-0.9.3-py3-none-any.whl",
  "./wheels/python_dateutil-2.9.0.post0-py2.py3-none-any.whl",
  "./wheels/six-1.17.0-py2.py3-none-any.whl",
]

license = ["SPDX:BSD-2-Clause"]
copyright = ["2024 Nicholas Pfaff"]

# Tags for discovery
tags = ["Import-Export", "Animation", "Mesh"]

[permissions]
files = "Import meshcat HTML recordings from disk"
